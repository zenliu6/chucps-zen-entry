<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課堂網頁入口</title>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--text:#1f2a44;--muted:#6b7694;--line:#e3e8f3;--accent:#4f6df5;--accent2:#8b5cf6;--accent-soft:#e9edff;--shadow:0 6px 20px rgba(40,60,120,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--surface:#1b2030;--text:#e8ecf8;--muted:#9aa4c2;--line:#2b3250;--accent:#7f95ff;--accent2:#a78bfa;--accent-soft:#252c4d;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151f;--surface:#1b2030;--text:#e8ecf8;--muted:#9aa4c2;--line:#2b3250;--accent:#7f95ff;--accent2:#a78bfa;--accent-soft:#252c4d;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:36px 20px 64px}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,40px);letter-spacing:.5px}
.sub{opacity:.9;margin-top:4px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--accent);color:#fff}
button.ghost{background:rgba(255,255,255,.18);color:#fff}
button.soft{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.main{max-width:1080px;margin:-40px auto 40px;padding:0 16px}
.bar{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:7px 14px;border-radius:99px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.ico{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:28px}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px;align-self:flex-start}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:7px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
dialog{border:0;border-radius:20px;padding:22px;background:var(--surface);color:var(--text);width:min(480px,92vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.qrbox{background:#fff;border-radius:16px;padding:16px;display:grid;place-items:center;margin:8px auto;width:fit-content;cursor:zoom-in}
.qrbox img,.qrbox canvas{display:block}
.qrt{text-align:center;font-weight:700;font-size:18px;margin-top:6px}
.hint{text-align:center;color:var(--muted);font-size:13px}
.big{width:min(96vw,720px)}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top">
    <div><h1 id="title">📚 課堂網頁入口</h1><div class="sub">點選卡片開啟教材，或產生 QR Code 讓學生掃描</div></div>
    <button class="ghost" id="bQuick">🔳 QR 產生器</button>
  </div>
</div></header>

<main class="main">
  <div class="bar" id="chips"></div>
  <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">載入中…</div></div>
</main>

<dialog id="dQR"><h2>📱 QR Code</h2>
  <div class="qrt" id="qrTitle"></div>
  <div class="qrbox" id="qrBox" title="點擊放大／縮小"></div>
  <div class="hint">點擊 QR 可放大，方便投影讓學生用平板掃描</div>
  <label>網址（可直接修改後即時產生）</label><input id="qrUrl" inputmode="url" placeholder="https://">
  <div class="row"><button data-close>關閉</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const DATA_FILE="portal-data.json";
const $=id=>document.getElementById(id);
let S={title:"📚 課堂網頁入口",cats:[],items:[]},cur="全部",qrSize=260,failed=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fixUrl(u){u=String(u||"").trim();return u&&!/^https?:\/\//i.test(u)?"https://"+u:u}

function render(){
  $("title").textContent=S.title||"📚 課堂網頁入口";
  const chips=["全部",...S.cats];
  if(!chips.includes(cur))cur="全部";
  $("chips").style.display=S.cats.length?"":"none";
  $("chips").innerHTML=chips.map(c=>`<button class="chip ${c===cur?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const list=S.items.map((it,n)=>({it,n})).filter(x=>cur==="全部"||x.it.cat===cur);
  $("grid").innerHTML=list.length?list.map(({it,n})=>`<div class="card"><div class="ico">${esc(it.icon||"🌐")}</div><h3>${esc(it.title)}</h3><p>${esc(it.desc)}</p>${it.cat?`<span class="tag">${esc(it.cat)}</span>`:""}
  <div class="acts"><button data-o="${n}">▶ 開啟</button><button class="soft" data-q="${n}">🔳 QR</button></div></div>`).join(""):
  `<div class="empty" style="grid-column:1/-1">${failed?"資料載入失敗，請重新整理頁面":"目前還沒有網頁"}</div>`;
}

async function load(){
  try{
    const r=await fetch(DATA_FILE+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw 0;
    const d=await r.json();
    if(!d||!Array.isArray(d.items))throw 0;
    S={title:d.title,cats:Array.isArray(d.cats)?d.cats:[],items:d.items};
  }catch(e){failed=true}
  render();
}

function drawQR(){
  const box=$("qrBox"),u=fixUrl($("qrUrl").value);box.innerHTML="";
  if(!u){box.innerHTML='<div style="color:#667;padding:60px 20px">請輸入網址</div>';return}
  try{new QRCode(box,{text:u,width:qrSize,height:qrSize,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M})}catch(e){box.textContent="網址過長，無法產生"}
}
function openQR(title,url){qrSize=260;$("dQR").classList.remove("big");$("qrTitle").textContent=title||"";$("qrUrl").value=url||"";$("dQR").showModal();drawQR()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.close!==undefined)t.closest("dialog").close();
  if(t.dataset.c!==undefined){cur=t.dataset.c;render()}
  if(t.dataset.o!==undefined){const i=S.items[+t.dataset.o];window.open(fixUrl(i.url),"_blank","noopener")}
  if(t.dataset.q!==undefined){const i=S.items[+t.dataset.q];openQR(i.title,fixUrl(i.url))}
});
$("bQuick").onclick=()=>openQR("快速產生 QR Code","");
$("qrUrl").addEventListener("input",drawQR);
$("qrBox").onclick=()=>{const big=$("dQR").classList.toggle("big");qrSize=big?Math.min(560,innerWidth-90):260;drawQR()};
load();
</script>
</body>
</html>
